# seekaudio — default configuration

audio:
  sample_rate: 22050
  duration: 30          # seconds to use from each track (centred excerpt)
  mono: true

features:
  n_mfcc: 20
  n_fft: 2048
  hop_length: 512
  n_chroma: 12
  n_mels: 128
  # which groups to include (toggle for ablation)
  groups:
    mfcc: true
    spectral: true
    rhythm: true
    energy: true
    tonal: false        # chroma + tonnetz — off by default
  # per-group weights applied after L2 normalisation (1.0 = equal)
  weights:
    mfcc: 1.0
    spectral: 1.0
    rhythm: 1.0
    energy: 1.0
    tonal: 1.0

space:
  pca_components: 40    # set to null to skip PCA
  whiten: true          # PCA whitening
  l2_normalize: true

retrieval:
  k: 10                 # default number of neighbours to return

paths:
  audio_dir: data/raw
  manifest: data/manifest.parquet
  features_dir: data/features
  feature_spec_version: 2
  space_dir: data/space
  evaluation_dir: data/evaluation
