[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seekaudio"
version = "0.2.0"
description = "Interpretable content-based music retrieval"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "soundfile>=0.12",
    "scikit-learn>=1.4", "pyarrow>=14", "PyYAML>=6", "joblib>=1.3",
    "matplotlib>=3.8", "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seekaudio = "seekaudio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["seekaudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
